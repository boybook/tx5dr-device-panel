[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tx5dr-device-panel"
version = "0.1.0"
description = "TX-5DR 128x64 OLED status panel client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "Pillow>=10",
  "luma.oled>=3.13",
  "pygame>=2.5",
  "PyYAML>=6",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
network-control = [
  "dbus-next>=0.2",
]

[project.scripts]
tx5dr-device-panel = "tx5dr_device_panel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
